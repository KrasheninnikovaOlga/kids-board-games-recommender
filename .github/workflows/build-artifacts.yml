name: Build app artifacts

# Precomputes data & features for the Streamlit app, so it starts in seconds.
# Runs when the model code changes, or manually from the Actions tab.
on:
  push:
    branches: [main]
    paths: ["recsys.py", "build_artifacts.py", ".github/workflows/build-artifacts.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas numpy scipy scikit-learn
      - run: python build_artifacts.py
      - name: Commit artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts
          git diff --cached --quiet || git commit -m "Rebuild app artifacts"
          git push
